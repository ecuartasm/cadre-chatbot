[project]
name = "cadre-chatbot"
version = "0.1.0"
description = "Customer-support chatbot for Cadre AI — grounded, with an explicit knowledge boundary"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=0.1",          # FastAPI/Starlette TestClient transport (starlette>=1.3 deprecates httpx)
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# This is an app, not an installable library — put the repo root on sys.path
# so `from app.main import app` resolves without a packaging step.
pythonpath = ["."]
