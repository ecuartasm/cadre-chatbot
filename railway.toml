# Railway service configuration. Explicit beats relying on auto-detection.
[build]
builder = "NIXPACKS"

[deploy]
# $PORT is injected by Railway at runtime — never hardcode it.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
