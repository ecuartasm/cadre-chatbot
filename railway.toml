# Railway service configuration.
[build]
# Dockerfile, not Nixpacks: this repo has two toolchains (Node for the bundle, Python for
# the API) and Nixpacks only auto-detects one of them.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# startCommand omitted on purpose — the Dockerfile CMD owns it, so $PORT handling
# lives in exactly one place.
